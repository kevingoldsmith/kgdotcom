    <!-- Webfonts, loaded without blocking first paint.

         main.css already styles the page in fallback faces and only applies the
         webfonts under .fonts-loaded, which js/fontfaceobserver.js adds once both
         families resolve. A plain <link rel="stylesheet"> here would block
         rendering on a third-party round trip and defeat that mechanism, which is
         what it was measured doing: ~1,650ms of render-blocking time.

         Both families come in one request; display=swap keeps text visible while
         they download. The preload+onload swap is the standard non-blocking CSS
         pattern, with a <noscript> fallback for scripting-disabled clients.

         Roboto Slab is requested at 400 AND 700. h1-h4 and #name are bold, so
         without a real 700 the browser synthesises one, and every engine fakes
         bold differently: Blink's is subtle, Safari's and Firefox's are heavier
         and coarser. That is why headings looked wrong outside Chrome. Didact
         Gothic has only one weight upstream, so .md-title stays synthetic. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css?family=Didact+Gothic%7CRoboto+Slab:400,700&amp;display=swap"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css?family=Didact+Gothic%7CRoboto+Slab:400,700&amp;display=swap" />
    </noscript>
    <!-- If the fonts already loaded earlier this session they are in the HTTP
         cache, so apply them here, before first paint, rather than waiting for
         js/fontfaceobserver.js at the end of the body. That means the swap is
         seen at most once per session instead of on every page navigation.
         Inline and in the head deliberately: an external script could not run
         early enough to beat the first paint. -->
    <script>
        try {
            if (sessionStorage.getItem('fonts-loaded')) {
                document.documentElement.className += ' fonts-loaded';
            }
        } catch (e) {
            /* private mode or storage disabled: fall back to observing */
        }
    </script>
